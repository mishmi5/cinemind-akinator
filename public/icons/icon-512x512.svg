<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="80" fill="#070709"/>
  <!-- Subtle radial glow -->
  <circle cx="256" cy="230" r="160" fill="url(#g1)" opacity="0.04"/>
  <g transform="translate(256, 230)" filter="url(#glow)">
    <!-- Play triangle -->
    <path d="M-80,-105 L105,0 L-80,105 Z" fill="url(#g1)" opacity="0.15"/>
    <path d="M-80,-105 L105,0 L-80,105" fill="none" stroke="url(#g1)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Neural nodes -->
    <circle cx="105" cy="0" r="24" fill="#070709" stroke="#f43f5e" stroke-width="12"/>
    <circle cx="-80" cy="-105" r="20" fill="#6366f1"/>
    <circle cx="-80" cy="105" r="20" fill="#f43f5e"/>
    <!-- Brain sparkles -->
    <circle cx="50" cy="-65" r="7" fill="#818cf8" opacity="0.8"/>
    <circle cx="78" cy="52" r="6" fill="#fb7185" opacity="0.7"/>
    <circle cx="-20" cy="-80" r="4" fill="#a5b4fc" opacity="0.5"/>
    <circle cx="10" cy="75" r="5" fill="#fda4af" opacity="0.5"/>
  </g>
  <!-- Text -->
  <text x="256" y="420" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="56" fill="white" letter-spacing="-1.5">CineMind</text>
  <text x="256" y="458" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="20" fill="#71717a" letter-spacing="3">AI MOVIE ENGINE</text>
</svg>
