<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>
  </defs>
  <rect width="192" height="192" rx="32" fill="#070709"/>
  <g transform="translate(96, 96)">
    <!-- Play triangle -->
    <path d="M-30,-40 L40,0 L-30,40 Z" fill="url(#g1)" opacity="0.2"/>
    <path d="M-30,-40 L40,0 L-30,40" fill="none" stroke="url(#g1)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Neural nodes -->
    <circle cx="40" cy="0" r="10" fill="#070709" stroke="#f43f5e" stroke-width="5"/>
    <circle cx="-30" cy="-40" r="8" fill="#6366f1"/>
    <circle cx="-30" cy="40" r="8" fill="#f43f5e"/>
    <!-- Brain sparkle -->
    <circle cx="20" cy="-25" r="3" fill="#818cf8" opacity="0.8"/>
    <circle cx="30" cy="20" r="2.5" fill="#fb7185" opacity="0.7"/>
  </g>
  <!-- Text -->
  <text x="96" y="155" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="22" fill="white" letter-spacing="-0.5">CineMind</text>
</svg>
